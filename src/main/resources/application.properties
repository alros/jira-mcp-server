# --- MCP server -------------------------------------------------------------
quarkus.mcp.server.server-info.name=jira
quarkus.mcp.server.server-info.version=${quarkus.application.version:1.0.0}
quarkus.mcp.server.stdio.enabled=true

# stdout is the MCP transport: never print anything else there.
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.log.category."eu.rossotto".level=INFO

# --- Jira (from environment) ------------------------------------------------
jira.url=${JIRA_URL:}
jira.username=${JIRA_USERNAME:}
jira.token=${JIRA_TOKEN:}
# Extra fields to return, comma-separated: ids (status, customfield_10016) or display names (Story Points)
jira.fields=${JIRA_FIELDS:}
jira.timeout=PT30S

# --- Native ------------------------------------------------------------------
quarkus.native.additional-build-args=--enable-url-protocols=https
