name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./build.sh jvm

      - uses: actions/upload-artifact@v4
        with:
          name: jira-mcp-server-jvm
          path: target/quarkus-app/
          if-no-files-found: error

  native:
    name: Native binary (macOS arm64)
    # Native builds are slow: skip them on pull requests.
    if: github.event_name != 'pull_request'
    needs: jvm
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jira-mcp-server-macos-arm64
          path: target/*-runner
          if-no-files-found: error

  release:
    name: GitHub release
    # Only for tag pushes (e.g. 1.1.0 or v1.1.0).
    if: startsWith(github.ref, 'refs/tags/')
    needs: [jvm, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        working-directory: dist
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Artifacts lose the executable bit: restore it and ship as tar.gz to keep it.
          mv jira-mcp-server-macos-arm64/*-runner jira-mcp-server
          chmod +x jira-mcp-server
          tar -czf "jira-mcp-server-${tag}-macos-arm64.tar.gz" jira-mcp-server
          (cd jira-mcp-server-jvm && zip -qr "../jira-mcp-server-${tag}-jvm.zip" .)
          ls -l *.tar.gz *.zip

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            *.tar.gz *.zip
