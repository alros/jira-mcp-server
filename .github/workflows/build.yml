name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./build.sh jvm

      - uses: actions/upload-artifact@v4
        with:
          name: jira-mcp-server-jvm
          path: target/quarkus-app/
          if-no-files-found: error

  native:
    name: Native binary (macOS arm64)
    # Native builds are slow: skip them on pull requests.
    if: github.event_name != 'pull_request'
    needs: jvm
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jira-mcp-server-macos-arm64
          path: target/*-runner
          if-no-files-found: error
